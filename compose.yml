services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGODB_USER: nexus
      MONGODB_PASS: nexus
      MONGODB_DB: nexus
    ports:
      - "27017:27017"
    volumes:
      - ./src/reputation/storage/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  api:
    build:
      context: .
    image: nexus:latest
    ports:
      - 8000:8000
    container_name: api
    environment:
      - DAMPENING=0.9
      - INFLUENCE=1.0
      - K=10
      - LF=1.0
      - STATEFUL=true
      - MONGODB_PORT=27017
      - MONGODB_HOST=mongodb
    depends_on:
      - mongodb